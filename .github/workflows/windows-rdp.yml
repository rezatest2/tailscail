name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Remote Desktop enabled."

      - name: 2. Create RDP Admin Account
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "CHANGE_THIS_PASSWORD_123!" -AsPlainText -Force

          if (-not (Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue)) {
              New-LocalUser `
                -Name "NvDAdmin" `
                -Password $Password `
                -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user created."

      - name: 3. Configure RDP Firewall
        shell: powershell
        run: |
          Write-Host "Configuring firewall..."

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Set-NetFirewallRule -Enabled True

          New-NetFirewallRule `
            -DisplayName "Allow RDP 3389" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -Action Allow `
            -Profile Any `
            -ErrorAction SilentlyContinue

          Write-Host "Firewall configured."

      - name: 4. Test RDP Port
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          Write-Host "Checking RDP service..."
          Get-Service TermService

          Write-Host ""
          Write-Host "Checking TCP 3389..."

          $test = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389

          $test | Format-List

          if (-not $test.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is NOT listening!"
              exit 1
          }

          Write-Host "RDP PORT 3389 IS OPEN!" -ForegroundColor Green

      - name: 5. Install Tailscale
        shell: powershell
        run: |
          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10

          if (-not (Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {
              Write-Error "Tailscale installation failed!"
              exit 1
          }

          Write-Host "Tailscale installed successfully."

      - name: 6. Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Connecting to Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "========== TAILSCALE STATUS =========="

          & "C:\Program Files\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "========== TAILSCALE IP =========="

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host $ts_ip -ForegroundColor Green

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP SERVER READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $ts_ip -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Username:"
          Write-Host "NvDAdmin" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "RDP Port:"
          Write-Host "3389" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Use this IP in Remote Desktop."
          Write-Host "=========================================="

      - name: 7. Final RDP Test
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          Write-Host "Final RDP test..."

          $test = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389

          if ($test.TcpTestSucceeded) {
              Write-Host ""
              Write-Host "RDP IS WORKING!" -ForegroundColor Green
              Write-Host ""
          }
          else {
              Write-Error "RDP TEST FAILED!"
              exit 1
          }

      - name: 8. Keep Server Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "SERVER IS NOW ONLINE."
          Write-Host "Do NOT stop this workflow."
          Write-Host ""

          for ($i = 1; $i -le 340; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/340] Server running..."
          }
